name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GENLAPROBLEMS_REF: main
  LALATEX_REF: main
  LAFIGURESPECS_REF: master
  MATRIXLAYOUT_REF: main

jobs:
  tests:
    name: Julia ${{ matrix.version }}
    runs-on: ubuntu-latest
    env:
      JULIA_PYTHONCALL_EXE: python3
    permissions:
      actions: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        version:
          - "1.10"
          - "1.12"

    steps:
      - uses: actions/checkout@v6

      - uses: actions/checkout@v6
        with:
          repository: ea42gh/GenLAProblems.jl
          ref: ${{ env.GENLAPROBLEMS_REF }}
          path: GenLAProblems

      - uses: actions/checkout@v6
        with:
          repository: ea42gh/LAlatex
          ref: ${{ env.LALATEX_REF }}
          path: LAlatex

      - uses: actions/checkout@v6
        if: matrix.version == '1.12'
        with:
          repository: ea42gh/LAFigureSpecs
          ref: ${{ env.LAFIGURESPECS_REF }}
          path: LAFigureSpecs

      - uses: actions/checkout@v6
        if: matrix.version == '1.12'
        with:
          repository: ea42gh/matrixlayout
          ref: ${{ env.MATRIXLAYOUT_REF }}
          path: matrixlayout

      - uses: actions/setup-python@v6
        if: matrix.version == '1.12'
        with:
          python-version: "3.11"

      - name: Install Python bridge dependencies
        if: matrix.version == '1.12'
        run: |
          python -m pip install --upgrade pip
          python -m pip install ./matrixlayout
          python -m pip install ./LAFigureSpecs

      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}

      - uses: julia-actions/cache@v3

      - name: Develop sibling Julia packages
        shell: julia --project=. {0}
        run: |
          using Pkg
          Pkg.develop(path=joinpath(pwd(), "GenLAProblems"))
          Pkg.develop(path=joinpath(pwd(), "LAlatex"))
          Pkg.instantiate()

      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1

      - name: Run Julia bridge smoke
        if: matrix.version == '1.12'
        env:
          JULIA_PYTHONCALL_EXE: python3
        shell: julia --project=. {0}
        run: |
          using LATeachingSuite

          la = LATeachingSuite.PythonBridge.load_LAFigureSpecs()
          ml = LATeachingSuite.PythonBridge.load_matrixlayout()

          function _hasproperty(x, name::Symbol)
              try
                  getproperty(x, name)
                  return true
              catch
                  return false
              end
          end

          @assert _hasproperty(la, :ge_tbl_spec)
          @assert _hasproperty(la, :qr_tbl_spec)
          @assert _hasproperty(ml, :render_ge_svg)
